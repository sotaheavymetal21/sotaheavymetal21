<svg xmlns="http://www.w3.org/2000/svg" width="860" height="232" viewBox="0 0 860 232" role="img" aria-label="SOTAHEAVYMETAL21 — FORWARD DEPLOYED ENGINEER">
  <title>SOTAHEAVYMETAL21 — FORWARD DEPLOYED ENGINEER</title>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; text-anchor: middle; }
    .mark  { font-size: 43px; font-weight: 700; letter-spacing: 4.5px; }
    .role  { font-size: 13.5px; font-weight: 700; letter-spacing: 6px; }
    .meta  { font-size: 10px; letter-spacing: 2.4px; }
    .tag   { font-size: 9.5px; font-weight: 700; letter-spacing: 2.6px; text-anchor: start; }

    .ghost-cyan    { animation: driftLeft  6s steps(1, end) infinite; }
    .ghost-magenta { animation: driftRight 6s steps(1, end) infinite; }
    @keyframes driftLeft {
      0%, 88%, 100% { transform: translateX(-2px); }
      90%           { transform: translateX(-7px); }
      92%           { transform: translateX(-1px); }
      95%           { transform: translateX(-5px); }
    }
    @keyframes driftRight {
      0%, 88%, 100% { transform: translateX(2px); }
      90%           { transform: translateX(7px); }
      92%           { transform: translateX(1px); }
      95%           { transform: translateX(5px); }
    }

    .scan { animation: sweep 6s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes sweep {
      0%        { transform: translateX(-200px); }
      60%, 100% { transform: translateX(940px); }
    }

    .blink { animation: blink 1.15s steps(1, end) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.05; } }

    @media (prefers-reduced-motion: reduce) {
      .ghost-cyan, .ghost-magenta, .scan, .blink { animation: none; }
      .scan { opacity: 0; }
    }
  </style>
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#7DCFFF" stop-opacity="0.17600000000000002"/>
      <stop offset="55%"  stop-color="#BB9AF7" stop-opacity="0.07700000000000001"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7DCFFF"/>
      <stop offset="50%"  stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#FF9E64"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7DCFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7DCFFF" stop-opacity="0.385"/>
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="860" height="232" rx="6" fill="#0D1117"/>
  <g stroke="#1F2937" stroke-width="1" opacity="0.45"><line x1="20" y1="0" x2="20" y2="232"/><line x1="40" y1="0" x2="40" y2="232"/><line x1="60" y1="0" x2="60" y2="232"/><line x1="80" y1="0" x2="80" y2="232"/><line x1="100" y1="0" x2="100" y2="232"/><line x1="120" y1="0" x2="120" y2="232"/><line x1="140" y1="0" x2="140" y2="232"/><line x1="160" y1="0" x2="160" y2="232"/><line x1="180" y1="0" x2="180" y2="232"/><line x1="200" y1="0" x2="200" y2="232"/><line x1="220" y1="0" x2="220" y2="232"/><line x1="240" y1="0" x2="240" y2="232"/><line x1="260" y1="0" x2="260" y2="232"/><line x1="280" y1="0" x2="280" y2="232"/><line x1="300" y1="0" x2="300" y2="232"/><line x1="320" y1="0" x2="320" y2="232"/><line x1="340" y1="0" x2="340" y2="232"/><line x1="360" y1="0" x2="360" y2="232"/><line x1="380" y1="0" x2="380" y2="232"/><line x1="400" y1="0" x2="400" y2="232"/><line x1="420" y1="0" x2="420" y2="232"/><line x1="440" y1="0" x2="440" y2="232"/><line x1="460" y1="0" x2="460" y2="232"/><line x1="480" y1="0" x2="480" y2="232"/><line x1="500" y1="0" x2="500" y2="232"/><line x1="520" y1="0" x2="520" y2="232"/><line x1="540" y1="0" x2="540" y2="232"/><line x1="560" y1="0" x2="560" y2="232"/><line x1="580" y1="0" x2="580" y2="232"/><line x1="600" y1="0" x2="600" y2="232"/><line x1="620" y1="0" x2="620" y2="232"/><line x1="640" y1="0" x2="640" y2="232"/><line x1="660" y1="0" x2="660" y2="232"/><line x1="680" y1="0" x2="680" y2="232"/><line x1="700" y1="0" x2="700" y2="232"/><line x1="720" y1="0" x2="720" y2="232"/><line x1="740" y1="0" x2="740" y2="232"/><line x1="760" y1="0" x2="760" y2="232"/><line x1="780" y1="0" x2="780" y2="232"/><line x1="800" y1="0" x2="800" y2="232"/><line x1="820" y1="0" x2="820" y2="232"/><line x1="840" y1="0" x2="840" y2="232"/><line x1="0" y1="20" x2="860" y2="20"/><line x1="0" y1="40" x2="860" y2="40"/><line x1="0" y1="60" x2="860" y2="60"/><line x1="0" y1="80" x2="860" y2="80"/><line x1="0" y1="100" x2="860" y2="100"/><line x1="0" y1="120" x2="860" y2="120"/><line x1="0" y1="140" x2="860" y2="140"/><line x1="0" y1="160" x2="860" y2="160"/><line x1="0" y1="180" x2="860" y2="180"/><line x1="0" y1="200" x2="860" y2="200"/><line x1="0" y1="220" x2="860" y2="220"/></g>
  <rect width="860" height="232" rx="6" fill="url(#halo)"/>
  <rect width="860" height="232" rx="6" fill="none" stroke="#233044" stroke-width="1"/>
  <path d="M18 36 L18 18 L36 18 M824 18 L842 18 L842 36 M842 196 L842 214 L824 214 M36 214 L18 214 L18 196" fill="none" stroke="#7DCFFF" stroke-width="1.6" stroke-linecap="square" opacity="0.75"/>

  <g>
    <rect x="32" y="30" width="3" height="11" fill="#9ECE6A" class="blink"/>
    <text x="42" y="39" class="tag" fill="#565F89">STATUS // ONLINE</text>
  </g>

  <g>
    <text class="mark ghost-cyan"    x="430" y="108" fill="#7DCFFF"    opacity="0.85">SOTAHEAVYMETAL21</text>
    <text class="mark ghost-magenta" x="430" y="108" fill="#BB9AF7" opacity="0.85">SOTAHEAVYMETAL21</text>
    <text class="mark"               x="430" y="108" fill="#C0CAF5" filter="url(#hero-glow)">SOTAHEAVYMETAL21</text>
  </g>

  <rect x="240" y="130" width="380" height="1" fill="url(#beam)"/>

  <text class="role" x="430" y="158" fill="#7DCFFF" filter="url(#hero-glow)">FORWARD DEPLOYED ENGINEER</text>
  <text class="meta" x="430" y="184" fill="#565F89">AI SHIFT, INC. — CYBERAGENT GROUP  //  TOKYO, JAPAN</text>

  <rect x="18" y="222" width="824" height="2" rx="1" fill="url(#rule)" opacity="0.9"/>

  <g clip-path="inset(0 round 6px)">
    <rect class="scan" x="0" y="0" width="180" height="232" fill="url(#beam)"/>
  </g>
</svg>
