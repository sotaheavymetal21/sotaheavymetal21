<svg xmlns="http://www.w3.org/2000/svg" width="860" height="208" viewBox="0 0 860 208" role="img" aria-label="GitHub and Qiita activity telemetry">
  <title>telemetry — 1,663 contributions, 837 commits, 79 articles</title>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
    .label   { font-size: 10px; font-weight: 700; letter-spacing: 2.2px; text-anchor: middle; }
    .value   { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; text-anchor: middle; }
    .caption { font-size: 9.5px; letter-spacing: 0.8px; text-anchor: middle; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 3px; }
    .meta    { font-size: 10px; letter-spacing: 1.4px; text-anchor: end; }

    /*
     * Content is never gated behind an animation: a static render (GitHub's
     * image cache, reduced-motion, an email digest) must still show every
     * number. Motion is layered on top of an already-complete frame.
     */
    .value { animation: flicker 7s steps(1, end) infinite; }
    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97%           { opacity: .4; }
      98%           { opacity: 1; }
      99%           { opacity: .65; }
    }

    .bracket { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: .7; }
      50%      { opacity: 1; }
    }

    .scan { animation: sweep 5.5s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes sweep {
      0%        { transform: translateX(-160px); }
      55%, 100% { transform: translateX(920px); }
    }

    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .value, .scan, .pulse, .bracket { animation: none; }
      .scan { opacity: 0; }
    }
  </style>
  <defs>
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B7FA8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#0B7FA8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B7FA8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B7FA8"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="860" height="208" rx="6" fill="#FFFFFF"/>
  <g stroke="#E4E8EE" stroke-width="1" opacity="0.5"><line x1="20" y1="0" x2="20" y2="208"/><line x1="40" y1="0" x2="40" y2="208"/><line x1="60" y1="0" x2="60" y2="208"/><line x1="80" y1="0" x2="80" y2="208"/><line x1="100" y1="0" x2="100" y2="208"/><line x1="120" y1="0" x2="120" y2="208"/><line x1="140" y1="0" x2="140" y2="208"/><line x1="160" y1="0" x2="160" y2="208"/><line x1="180" y1="0" x2="180" y2="208"/><line x1="200" y1="0" x2="200" y2="208"/><line x1="220" y1="0" x2="220" y2="208"/><line x1="240" y1="0" x2="240" y2="208"/><line x1="260" y1="0" x2="260" y2="208"/><line x1="280" y1="0" x2="280" y2="208"/><line x1="300" y1="0" x2="300" y2="208"/><line x1="320" y1="0" x2="320" y2="208"/><line x1="340" y1="0" x2="340" y2="208"/><line x1="360" y1="0" x2="360" y2="208"/><line x1="380" y1="0" x2="380" y2="208"/><line x1="400" y1="0" x2="400" y2="208"/><line x1="420" y1="0" x2="420" y2="208"/><line x1="440" y1="0" x2="440" y2="208"/><line x1="460" y1="0" x2="460" y2="208"/><line x1="480" y1="0" x2="480" y2="208"/><line x1="500" y1="0" x2="500" y2="208"/><line x1="520" y1="0" x2="520" y2="208"/><line x1="540" y1="0" x2="540" y2="208"/><line x1="560" y1="0" x2="560" y2="208"/><line x1="580" y1="0" x2="580" y2="208"/><line x1="600" y1="0" x2="600" y2="208"/><line x1="620" y1="0" x2="620" y2="208"/><line x1="640" y1="0" x2="640" y2="208"/><line x1="660" y1="0" x2="660" y2="208"/><line x1="680" y1="0" x2="680" y2="208"/><line x1="700" y1="0" x2="700" y2="208"/><line x1="720" y1="0" x2="720" y2="208"/><line x1="740" y1="0" x2="740" y2="208"/><line x1="760" y1="0" x2="760" y2="208"/><line x1="780" y1="0" x2="780" y2="208"/><line x1="800" y1="0" x2="800" y2="208"/><line x1="820" y1="0" x2="820" y2="208"/><line x1="840" y1="0" x2="840" y2="208"/><line x1="0" y1="20" x2="860" y2="20"/><line x1="0" y1="40" x2="860" y2="40"/><line x1="0" y1="60" x2="860" y2="60"/><line x1="0" y1="80" x2="860" y2="80"/><line x1="0" y1="100" x2="860" y2="100"/><line x1="0" y1="120" x2="860" y2="120"/><line x1="0" y1="140" x2="860" y2="140"/><line x1="0" y1="160" x2="860" y2="160"/><line x1="0" y1="180" x2="860" y2="180"/><line x1="0" y1="200" x2="860" y2="200"/></g>
  <rect width="860" height="208" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1"/>

  <g>
    <rect x="16" y="24" width="3" height="14" fill="#0B7FA8" class="pulse"/>
    <text x="28" y="35" class="head" fill="#1F2328">TELEMETRY</text>
    <text x="844" y="35" class="meta" fill="#656D76">SYNCED 2026-08-10</text>
  </g>

  
  <g class="panel">
    <rect x="16" y="58" width="196.5" height="112" rx="4"
          fill="#F6F8FA" stroke="#D5DBE3" stroke-width="1"/>
    <path class="bracket" style="animation-delay:0.00s" d="M16 70 L16 58 L28 58 M200.5 58 L212.5 58 L212.5 70 M212.5 158 L212.5 170 L200.5 170 M28 170 L16 170 L16 158" fill="none" stroke="#0B7FA8" stroke-width="1.6" stroke-linecap="square"/>
    <text x="114.25" y="84" class="label" fill="#656D76">CONTRIBUTIONS</text>
    <text x="114.25" y="128" class="value" style="animation-delay:0.00s" fill="#0B7FA8"
          filter="url(#neon-glow)">1,663</text>
    <text x="114.25" y="152" class="caption" fill="#656D76">last 12 months</text>
  </g>
  <g class="panel">
    <rect x="226.5" y="58" width="196.5" height="112" rx="4"
          fill="#F6F8FA" stroke="#D5DBE3" stroke-width="1"/>
    <path class="bracket" style="animation-delay:0.85s" d="M226.5 70 L226.5 58 L238.5 58 M411 58 L423 58 L423 70 M423 158 L423 170 L411 170 M238.5 170 L226.5 170 L226.5 158" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="square"/>
    <text x="324.75" y="84" class="label" fill="#656D76">COMMITS</text>
    <text x="324.75" y="128" class="value" style="animation-delay:0.85s" fill="#7C3AED"
          filter="url(#neon-glow)">837</text>
    <text x="324.75" y="152" class="caption" fill="#656D76">791 private</text>
  </g>
  <g class="panel">
    <rect x="437" y="58" width="196.5" height="112" rx="4"
          fill="#F6F8FA" stroke="#D5DBE3" stroke-width="1"/>
    <path class="bracket" style="animation-delay:1.70s" d="M437 70 L437 58 L449 58 M621.5 58 L633.5 58 L633.5 70 M633.5 158 L633.5 170 L621.5 170 M449 170 L437 170 L437 158" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="square"/>
    <text x="535.25" y="84" class="label" fill="#656D76">ARTICLES</text>
    <text x="535.25" y="128" class="value" style="animation-delay:1.70s" fill="#15803D"
          filter="url(#neon-glow)">79</text>
    <text x="535.25" y="152" class="caption" fill="#656D76">published on Qiita</text>
  </g>
  <g class="panel">
    <rect x="647.5" y="58" width="196.5" height="112" rx="4"
          fill="#F6F8FA" stroke="#D5DBE3" stroke-width="1"/>
    <path class="bracket" style="animation-delay:2.55s" d="M647.5 70 L647.5 58 L659.5 58 M832 58 L844 58 L844 70 M844 158 L844 170 L832 170 M659.5 170 L647.5 170 L647.5 158" fill="none" stroke="#C2410C" stroke-width="1.6" stroke-linecap="square"/>
    <text x="745.75" y="84" class="label" fill="#656D76">CERTIFICATIONS</text>
    <text x="745.75" y="128" class="value" style="animation-delay:2.55s" fill="#C2410C"
          filter="url(#neon-glow)">7</text>
    <text x="745.75" y="152" class="caption" fill="#656D76">AWS x4 / IPA x3</text>
  </g>

  <rect x="16" y="186" width="828" height="2" rx="1" fill="url(#rule-grad)" opacity="0.85"/>

  <g clip-path="inset(0 round 6px)">
    <rect class="scan" x="0" y="0" width="140" height="208" fill="url(#scan-grad)"/>
  </g>
</svg>
