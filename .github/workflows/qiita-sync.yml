name: Sync Qiita Articles

# Refreshes the article table between the QIITA markers in README.md.
# The Qiita v2 endpoint is public, so no credentials are needed.

on:
  schedule:
    # Kept clear of the other jobs that push to this branch.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiita-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh article table
        run: npm run sync:qiita

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No article changes."
            exit 0
          fi
          git commit -m "chore: refresh Qiita article list"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
