name: Refresh Assets

# Regenerates the committed hero and telemetry SVGs.
#
# PROFILE_TOKEN (classic PAT, read:user) is optional but recommended: the
# default GITHUB_TOKEN cannot read restricted contributions, and without it the
# generator keeps the last committed counts rather than publishing public-only
# figures. See scripts/lib/stats-guard.mjs.

on:
  schedule:
    # Offset from the 3D contribution job (15:00 UTC) so the two never race.
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify generators
        run: npm test

      - name: Regenerate SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json
          if git diff --staged --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore: refresh generated profile assets"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
