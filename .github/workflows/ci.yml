name: CI

# The scheduled jobs rewrite committed assets and the README. Running the
# generator tests on every change keeps a broken renderer from shipping.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm test
